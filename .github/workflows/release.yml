name: Release

# Tag-driven, so cutting a release is a deliberate act rather than a side effect
# of merging. The tag is also the version: `pocket-ap version` reports it, and
# that string is what a bug report is asked for, so it has to come from the tag
# rather than from `git describe` on a runner's shallow clone.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # This job exists because of the ORDER goreleaser does things in. It builds,
  # publishes the GitHub release, and only THEN pushes the Homebrew formula — so
  # a missing or under-permissioned tap token fails after the tag is public and
  # the release is out, which is the worst moment to discover it and awkward to
  # undo. Checking first costs seconds and fails while nothing has shipped.
  # It lives in its own workflow so it can also be run on demand, without a tag.
  # Testing a credential by pushing a tag is expensive: the Go module proxy caches
  # a tag's content permanently, so a version number spent on a failed release
  # cannot be reused.
  preflight:
    name: preflight
    uses: ./.github/workflows/tap-token-check.yml
    secrets: inherit

  release:
    name: release
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history: the build stamps the version and commit, and a
          # shallow clone would stamp a version that exists nowhere. goreleaser
          # also builds its changelog from the commits since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Module cache only; the build cache is restored below. setup-go
          # derives one key from (os, go version, go.sum) and shares it across
          # jobs, and it only SAVES on a miss — so this job restored CI's
          # host-architecture cache, was told it was a hit, and therefore never
          # stored the cross-architecture objects that make a release slow.
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Written by the cross-compile job in ci.yml on every push to main.
          # This tree is cosmos-sdk, cometbft and go-ethereum through the
          # shannon-sdk, and goreleaser builds five targets: compiling it cold
          # five times was most of this job's wall clock.
          key: ${{ runner.os }}-go-release-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-release-

      - name: Warm build cache
        run: go build ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          # PINNED, not a range. "~> v2" resolves to whatever the newest v2.x is
          # on the day someone tags, which is a moving part in the one job that
          # cannot be rehearsed — and .goreleaser.yaml still uses `brews:`, which
          # goreleaser has deprecated in favour of `homebrew_casks`. A v2.x that
          # drops it would fail this release at config parse, on a tag that is
          # already public. Bump this deliberately, after running
          # `goreleaser release --snapshot --clean` locally on the new version.
          version: "v2.17.1"
          args: release --clean
        env:
          # Two DIFFERENT credentials, and they are not interchangeable.
          # GITHUB_TOKEN is scoped to this repository and publishes the release;
          # it cannot write to homebrew-tap. HOMEBREW_TAP_GITHUB_TOKEN does only
          # the formula push. See the brews block in .goreleaser.yaml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # npm publishing is deferred (see npm/README.md), so this job reports a skip
  # and CANNOT fail a release. It is deliberately not gated by preflight for the
  # same reason. If publishing is ever turned on, it publishes the platform
  # packages before the wrapper, because a wrapper whose optionalDependencies do
  # not exist yet installs with a missing binary for anyone quick enough to catch
  # the gap.
  npm:
    name: npm
    needs: release
    # Gated on a repository VARIABLE, not a secret, and off by default. Without
    # this the job still builds all five targets before discovering it has
    # nothing to publish, which is minutes of every release spent on a skip.
    # Set NPM_PUBLISH=true to turn it on, once there is something to turn on.
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance: links the package to this repo and this run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The binaries are rebuilt rather than downloaded from the release: the
      # release job's dist/ does not survive into this one, and `goreleaser build`
      # with the same tag and config produces the same artifacts. -trimpath and
      # the ldflags come from .goreleaser.yaml, so the stamped version matches
      # what the archives carry.
      - name: Build the binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "v2.17.1"
          args: build --clean --snapshot

      - name: Generate the packages
        run: node npm/generate.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out npm/build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not set — skipping npm publish. See npm/README.md."
            exit 0
          fi

          # Platform packages first: the wrapper depends on them by exact version,
          # and publishing it first opens a window where an install resolves the
          # wrapper and finds no binary.
          for dir in npm/build/pocket-ap-*; do
            echo "publishing $dir"
            npm publish "$dir" --access public --provenance
          done
          npm publish npm/build/pocket-ap --access public --provenance
        shell: bash

  image:
    name: container image
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The Dockerfile's VERSION/COMMIT/DATE args decide what `pocket-ap
          # version` prints from inside the image. Without them every image
          # reports itself as "docker", which is useless in a bug report.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          # Releases are weeks apart, so nothing here is hot — but `go mod
          # download` is a layer of its own keyed on go.mod/go.sum alone, and
          # that is the part worth carrying between them. mode=max keeps the
          # intermediate build stage too, not just the scratch image, which is
          # the only way any of the compile survives.
          cache-from: type=gha
          cache-to: type=gha,mode=max
