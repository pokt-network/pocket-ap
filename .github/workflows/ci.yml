name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Module cache only. The BUILD cache is handled below, because
          # setup-go derives one key from (os, go version, go.sum) and shares it
          # across every job in the workflow — so whichever job's post-step
          # finishes first claims it, and the others restore a cache holding
          # none of their object files while being told it was a hit.
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Per-job key. The race suite's object tree is instrumented and lives
          # in its own GOCACHE namespace, so it must not share a key with lint's.
          key: ${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          # Without this fallback, a go.sum change means a fully cold rebuild of
          # cosmos-sdk, cometbft and go-ethereum — which is exactly why the run
          # after a dependency bump is always the slowest one.
          restore-keys: ${{ runner.os }}-go-test-

      # `go test ./...` compiles every package in the module, so a separate
      # build step proves nothing the tests do not already prove. The release
      # workflow does the CGO-free cross-compile next door.
      - name: Test (race)
        run: make test

  # Cross-compiling here does two jobs at once. It catches a target breaking
  # before a tag depends on it — until now windows/amd64 was only ever built
  # during a release, on a public tag that cannot be moved. And it populates the
  # Go build cache that the RELEASE workflow restores: a cache saved on the
  # default branch is readable by a tag-triggered run (measured with a throwaway
  # probe, because the documentation is ambiguous on exactly that case), while a
  # cache saved from a pull request is scoped to that pull request and would warm
  # nothing. Hence push-only.
  #
  # Every run also refreshes the entry's access time, which is what keeps it from
  # being evicted: GitHub drops caches untouched for 7 days, and releases are
  # further apart than that.
  crossbuild:
    name: cross-compile
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # Shared with .github/workflows/release.yml on purpose — that is the
          # whole point. Keep the two keys identical if either changes.
          key: ${{ runner.os }}-go-release-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-release-

      # `make dist` builds the same five targets as goreleaser with the same
      # CGO_ENABLED=0 and -trimpath, so the compiled package objects are the ones
      # the release reuses. The differing -ldflags only affect the final link.
      - name: Cross-compile every release target
        run: make dist

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-lint-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-lint-

      # golangci-lint loads packages through go/packages, and a cold type-check
      # of this dependency tree otherwise blows its timeout on a fresh runner.
      - name: Warm build cache
        run: go build ./...

      # NOTE: no separate `go vet` step. golangci-lint runs govet, and in config
      # v2 an `enable:` list ADDS to the default linter set rather than replacing
      # it, so vet was never opted out of — a second run is a second opinion from
      # the same analyzers, on the critical path.
      #
      # The version is coupled to .golangci.yml, which is `version: "2"`: a v1
      # binary cannot parse it and fails with "unsupported version of the
      # configuration" while `make lint` passes locally. golangci-lint-action@v6
      # installs v1 by default, which is exactly that trap. Bump this pin in
      # lockstep with the local install or CI and local disagree.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout 10m
