name: cache scope probe

# TEMPORARY. Answers one question the docs are ambiguous about: can a run
# triggered by a TAG restore a cache saved by a run on main? The release
# workflow is tag-triggered, so the answer decides whether caching the Go build
# tree between releases can ever hit. Delete this file once recorded.
on:
  push:
    branches: [main]
    tags: ["cachetest-*"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare the cached directory
        run: mkdir -p ~/probe-cache

      - uses: actions/cache@v4
        id: probe
        with:
          path: ~/probe-cache
          key: cache-scope-probe-v1

      - name: Report
        run: |
          echo "ref=${{ github.ref }}"
          echo "PROBE_RESULT hit=${{ steps.probe.outputs.cache-hit }}"
          ls -la ~/probe-cache || true
          if [ ! -f ~/probe-cache/marker ]; then
            echo "written-by=${{ github.ref }}" > ~/probe-cache/marker
            echo "PROBE_RESULT wrote a new marker (this run will save the cache)"
          else
            echo "PROBE_RESULT restored marker: $(cat ~/probe-cache/marker)"
          fi
